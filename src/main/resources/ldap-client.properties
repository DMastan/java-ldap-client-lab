# ==============================================================================
# Configuration du client Java LDAP / PAM
# ==============================================================================

# Hôte et port OpenLDAP (127.0.0.1:10389 depuis l'hôte, ou ldap-master:389 depuis un conteneur)
ldap.host=127.0.0.1
ldap.port=10389
ldap.ssl=false
ldap.starttls=false

# Arborescence LDAP
ldap.baseDn=dc=lab,dc=example,dc=org
ldap.usersOu=ou=users
ldap.groupsOu=ou=groups

# Identifiants de connexion administrateur LDAP (pour le provisioning et gestion)
ldap.adminDn=cn=admin,dc=lab,dc=example,dc=org
ldap.adminPassword=AdminSecretPassword123!

# Mapping des attributs pour s'adapter à une base personnalisée
# Pour OpenLDAP standard / PAM :
ldap.attribute.user=uid
ldap.attribute.group=cn
ldap.attribute.posixMember=memberUid
ldap.attribute.dnMember=member

# Paramètres par défaut pour les utilisateurs créés
ldap.posix.minUid=10000
ldap.posix.defaultGid=10001
ldap.posix.defaultShell=/bin/bash
ldap.posix.defaultHomePrefix=/home/

# Délais d'expiration réseau (en ms)
ldap.timeout.connection=5000
ldap.timeout.read=10000
